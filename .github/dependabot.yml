version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    ignore:
      # Must not be newer than engines.vscode, or vsce refuses to package.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # p-queue 7+ is ESM-only with a new API, and 10 requires Node 22.
      - dependency-name: "p-queue"
        update-types: ["version-update:semver-major"]
      # TypeScript 6 deprecates the tsconfig defaults this project relies on,
      # and TypeScript 7 (native port) does not work with ts-loader.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Must match the Node version of the extension host (Node 20 for
      # engines.vscode ^1.90.0).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
